<title>Jet Atlas</title>
<meta name="description" content="Fighters and bombers drawn entirely in ASCII: live afterburner, real loadouts, weights, thrust and performance for 26 combat aircraft.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Jet Atlas: a single dark "ops room" look, chosen on purpose (the ASCII renderer is tuned for a dark ground). */
:root {
  color-scheme: dark;
  --ground: #0a0d10;
  --panel: rgba(15, 20, 25, 0.9);
  --panel-solid: #0f1419;
  --raise: #172028;
  --line: #243039;
  --line-2: #33434f;
  --ink: #d7dee3;
  --ink-2: #a9b6bf;
  --muted: #74838e;
  --amber: #ffb04a;
  --amber-dim: #8a5a1f;
  --flame: #ff7a2e;
  --steel: #8fcbe0;
  --steel-dim: #2f5566;
  --warn: #ff6b57;
  --ok: #7fd49a;
  --display: "Chakra Petch", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --left-w: 292px;
  --right-w: 404px;
  --top-h: 56px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.45 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

#stage { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#view.drag { cursor: grabbing; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lab { position: absolute; transform: translate(10px, -50%); font: 600 11px/1 var(--mono); color: var(--ink); background: rgba(10, 13, 16, 0.78); border: 1px solid var(--line-2); border-left: 2px solid var(--steel); padding: 3px 6px; white-space: nowrap; opacity: 0; transition: opacity .25s; }
.lab::before { content: ""; position: absolute; left: -12px; top: 50%; width: 10px; border-top: 1px solid var(--steel); }
.lab.on { opacity: 1; }
.lab b { color: var(--steel); font-weight: 600; margin-right: 6px; }

/* top bar */
#top { position: fixed; top: 0; left: 0; right: 0; height: calc(var(--top-h) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 16px 0; display: flex; align-items: center; gap: 18px; z-index: 5; background: linear-gradient(var(--ground), rgba(10, 13, 16, 0)); pointer-events: none; }
#top > * { pointer-events: auto; }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand h1 { margin: 0; font: 700 22px/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; }
.brand h1 span { color: var(--amber); }
.brand small { color: var(--muted); font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
.topr { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.btn { background: var(--raise); border: 1px solid var(--line-2); border-radius: 3px; padding: 6px 11px; font: 600 12px/1 var(--mono); letter-spacing: 0.04em; color: var(--ink-2); white-space: nowrap; }
.btn:hover { color: var(--ink); border-color: var(--muted); }
.btn.on { color: var(--ground); background: var(--steel); border-color: var(--steel); }
.btn.hot.on { background: var(--amber); border-color: var(--amber); }
.btn kbd { font: inherit; opacity: 0.55; margin-left: 5px; }
#menuBtn { display: none; }

/* left: aircraft index */
#index { position: fixed; left: 16px; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); bottom: 16px; width: var(--left-w); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; z-index: 4; backdrop-filter: blur(6px); }
.search { padding: 12px 12px 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.search input { width: 100%; background: var(--ground); border: 1px solid var(--line-2); border-radius: 3px; padding: 8px 10px; font: 13px var(--mono); }
.search input::placeholder { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { background: none; border: 1px solid var(--line-2); border-radius: 20px; padding: 3px 9px; font: 500 12px/1.2 var(--body); color: var(--ink-2); }
.chip.on { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.sortrow { display: flex; justify-content: space-between; align-items: center; font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.sortrow select { background: var(--ground); border: 1px solid var(--line-2); border-radius: 3px; padding: 2px 4px; font: 11px var(--mono); }
#list { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
#list .grp { padding: 10px 14px 4px; font: 600 11px var(--mono); color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
#list button { width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid transparent; padding: 7px 12px; display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; }
#list button:hover { background: var(--raise); }
#list button.on { background: var(--raise); border-left-color: var(--amber); }
#list .n { font: 600 15px/1.2 var(--display); letter-spacing: 0.02em; }
#list .m { grid-column: 1; font: 12px/1.2 var(--body); color: var(--muted); }
#list .v { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 12px var(--mono); color: var(--ink-2); text-align: right; }
#list .v i { display: block; font-style: normal; color: var(--muted); font-size: 11px; }

/* right: dossier */
#dossier { position: fixed; right: 16px; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); bottom: 16px; width: var(--right-w); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; z-index: 4; backdrop-filter: blur(6px); }
.dhead { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.eyebrow { font: 500 11px/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.eyebrow .tag { color: var(--ground); background: var(--steel); padding: 1px 5px; border-radius: 2px; }
.eyebrow .tag.bomber { background: var(--amber); }
.eyebrow .tag.attack { background: var(--ok); }
.dhead h2 { margin: 6px 0 2px; font: 700 28px/1.05 var(--display); letter-spacing: 0.02em; text-wrap: balance; }
.dhead .sub { color: var(--ink-2); font-size: 14px; }
.strip { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.strip div { padding: 10px 12px; border-right: 1px solid var(--line); }
.strip div:last-child { border-right: 0; }
.strip b { display: block; font: 600 18px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.strip span { font: 10px/1.2 var(--mono); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 4px 8px; font: 600 12px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--amber); }
.tabs button:hover { color: var(--ink); }
#pane > * { min-width: 0; }
#pane { overflow-y: auto; flex: 1; padding: 14px 18px 20px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; display: grid; gap: 18px; align-content: start; }
.sec h3 { margin: 0 0 8px; font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.sec h3 em { font-style: normal; color: var(--ink-2); letter-spacing: 0.02em; text-transform: none; }
.presets { display: grid; gap: 6px; }
.preset { text-align: left; background: var(--ground); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; display: grid; gap: 2px; }
.preset:hover { border-color: var(--line-2); }
.preset.on { border-color: var(--amber); box-shadow: inset 3px 0 0 var(--amber); }
.preset b { font: 600 14px/1.2 var(--display); letter-spacing: 0.02em; }
.preset span { font-size: 13px; color: var(--muted); line-height: 1.3; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
th { font-weight: 400; color: var(--muted); width: 44%; padding-right: 10px; }
td.r, th.r { text-align: right; }
.stn td { padding: 4px 0; vertical-align: middle; }
.stn td:first-child { font: 600 12px var(--mono); color: var(--steel); width: 44px; }
.stn .lbl { font-size: 12px; color: var(--muted); display: block; line-height: 1.1; }
.stn select { width: 100%; background: var(--ground); border: 1px solid var(--line-2); border-radius: 3px; padding: 3px 4px; font: 12px var(--body); }
.stn td.kg { font: 12px var(--mono); color: var(--ink-2); text-align: right; width: 70px; white-space: nowrap; }
.stn tr.hl td { background: rgba(143, 203, 224, 0.08); }
.est { font: 600 9px var(--mono); color: var(--amber); vertical-align: super; margin-left: 3px; letter-spacing: 0.04em; }
.bar { position: relative; height: 18px; background: var(--ground); border: 1px solid var(--line); border-radius: 2px; display: flex; overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font: 11px var(--mono); color: var(--ink-2); }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 5px; background: var(--c); vertical-align: -1px; }
.kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.kv div { background: var(--ground); border: 1px solid var(--line); border-radius: 3px; padding: 7px 9px; }
.kv b { display: block; font: 600 16px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.kv span { font: 10px/1.2 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.kv .warn b { color: var(--warn); }
.note { font-size: 12.5px; color: var(--muted); line-height: 1.45; margin: 0; }
.prose { font-size: 15px; line-height: 1.55; margin: 0; max-width: 62ch; }
.range { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font: 12px var(--mono); color: var(--ink-2); }
input[type=range] { accent-color: var(--steel); width: 100%; }
svg text { font-family: var(--mono); }

/* bottom: throttle console */
#console { position: fixed; left: calc(16px + var(--left-w) + 16px); right: calc(16px + var(--right-w) + 16px); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 4; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
#console > * { pointer-events: auto; }
.throttle { width: min(640px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px 8px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; backdrop-filter: blur(6px); }
.throttle .tl { font: 600 11px var(--mono); letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
.throttle .state { font: 600 13px var(--mono); color: var(--ink); text-align: right; min-width: 170px; }
.throttle .state.ab { color: var(--amber); }
.tt { position: relative; height: 26px; }
#thr { -webkit-appearance: none; appearance: none; position: absolute; inset: 0; margin: 0; background: transparent; width: 100%; height: 26px; }
#thr::-webkit-slider-runnable-track { height: 8px; border-radius: 2px; background: var(--track); }
#thr::-moz-range-track { height: 8px; border-radius: 2px; background: var(--track); }
#thr::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 24px; margin-top: -8px; border-radius: 2px; background: var(--ink); border: 2px solid var(--ground); box-shadow: 0 0 0 1px var(--muted); }
#thr::-moz-range-thumb { width: 12px; height: 22px; border-radius: 2px; background: var(--ink); border: 2px solid var(--ground); }
.ticks { grid-column: 2; position: relative; height: 14px; font: 10px var(--mono); color: var(--muted); letter-spacing: 0.06em; }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ticks span.ab { color: var(--amber); }
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }
.readout { grid-column: 1 / -1; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; font: 12px var(--mono); color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 6px; }
.readout b { color: var(--ink); font-weight: 600; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.tools .sep { width: 1px; background: var(--line-2); margin: 2px 2px; }
#sweepBox { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 3px 10px; font: 12px var(--mono); color: var(--ink-2); }
#sweepBox input { width: 120px; }

#tip { position: fixed; z-index: 9; pointer-events: none; background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 3px; padding: 8px 10px; max-width: 260px; font-size: 13px; line-height: 1.35; }
#tip b { font: 600 14px var(--display); display: block; }
#tip .mono { font-size: 11.5px; color: var(--ink-2); }

/* compare */
#cmpTray { position: fixed; left: calc(16px + var(--left-w) + 16px); top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); z-index: 4; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100vw - var(--left-w) - var(--right-w) - 80px); }
#cmpTray .chip { background: var(--panel); }
#cmp { position: fixed; inset: 0; z-index: 20; background: rgba(6, 8, 10, 0.86); display: grid; place-items: center; padding: 24px 16px; }
#cmp .box { background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 4px; width: min(1000px, 100%); max-height: 100%; overflow: auto; padding: 18px 20px; }
#cmp h2 { margin: 0 0 12px; font: 700 20px var(--display); letter-spacing: 0.06em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
#cmp table { font-size: 13px; min-width: 560px; }
#cmp th { width: 190px; }
#cmp td { padding: 6px 10px 6px 0; }
#cmp td .b { height: 4px; background: var(--steel-dim); margin-top: 4px; }
#cmp td .b i { display: block; height: 100%; background: var(--steel); }
#cmp thead th { font: 700 15px var(--display); color: var(--ink); }
#help { position: fixed; inset: 0; z-index: 20; background: rgba(6, 8, 10, 0.86); display: grid; place-items: center; padding: 16px; }
#help .box { background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 4px; width: min(620px, 100%); padding: 18px 22px; max-height: 100%; overflow: auto; }
#help h2 { margin: 0 0 10px; font: 700 20px var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
#help td { padding: 5px 0; }
#help td:first-child { font: 600 12px var(--mono); color: var(--steel); width: 150px; }

/* loadout sheet */
.sheetlink { width: 100%; text-align: left; padding: 9px 11px; white-space: normal; line-height: 1.35; color: var(--amber); border-color: var(--amber-dim); }
#sheet { position: fixed; inset: 0; z-index: 20; background: rgba(6, 8, 10, 0.9); display: grid; place-items: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
#sheet .sbox { background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 4px; width: min(1180px, 100%); max-height: 100%; overflow-y: auto; padding: 18px 20px 22px; display: grid; gap: 18px; }
#sheet .sbox > * { min-width: 0; }
.shead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.shead h2 { margin: 0; font: 700 24px/1.1 var(--display); letter-spacing: 0.03em; }
.shead h2 span { color: var(--ink-2); font-weight: 500; }
.ssum { display: grid; grid-template-columns: repeat(6, 1fr); border: 1px solid var(--line); border-radius: 3px; }
.ssum div { padding: 9px 12px; border-right: 1px solid var(--line); }
.ssum div:last-child { border-right: 0; }
.ssum b { display: block; font: 600 17px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.ssum span { font: 10px/1.2 var(--mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.sh { margin: 0 0 8px; font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.sh em { font-style: normal; text-transform: none; letter-spacing: 0.02em; color: var(--ink-2); margin-left: 8px; }
.chartwrap { overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
#chart { display: flex; gap: 6px; min-width: min-content; }
.stc { flex: 0 0 116px; display: grid; grid-template-rows: auto auto 22px auto auto auto auto; justify-items: center; text-align: center; gap: 2px; background: var(--ground); border: 1px solid var(--line); border-radius: 3px; padding: 8px 6px; }
.stc:hover:not(:disabled) { border-color: var(--muted); }
.stc.on { border-color: var(--amber); box-shadow: inset 0 -3px 0 var(--amber); }
.stc.bay { background: #0e1216; border-style: dashed; }
.stc.empty { opacity: 0.55; cursor: default; }
.stc .sid { font: 600 13px var(--mono); color: var(--steel); }
.stc .sk { font: 10px/1.2 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.stc .line { width: 2px; height: 100%; background: var(--line-2); }
.stc b { font: 600 14px/1.15 var(--display); }
.stc b.none { color: var(--muted); font-weight: 500; }
.stc .n { font: 12px var(--mono); color: var(--ink-2); }
.stc .cat { font: 10px/1.2 var(--mono); color: var(--c); }
.stc .kg { font: 11px var(--mono); color: var(--muted); }
.sgrid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.viewer { position: relative; background: #07090b; border: 1px solid var(--line); border-radius: 3px; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; }
#sheetView { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.vlabel { position: absolute; left: 10px; bottom: 8px; font: 10px var(--mono); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
#storeCard h3 { margin: 6px 0 4px; font: 700 22px/1.15 var(--display); }
#storeCard h4 { margin: 14px 0 6px; font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
#storeCard .eyebrow .tag { color: var(--ground); }
#storeCard table { margin-top: 8px; }
#storeCard th { width: 34%; }

@media (max-width: 1180px) { :root { --left-w: 250px; --right-w: 360px; } }

/* phones and small tablets: the page scrolls; viewer on top, dossier below */
@media (max-width: 860px) {
  body { overflow: auto; }
  #top { position: sticky; background: var(--ground); height: auto; min-height: 52px; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px; flex-wrap: wrap; gap: 8px 12px; }
  .brand small { display: none; }
  #menuBtn { display: flex; align-items: center; gap: 8px; order: 3; flex: 1 0 100%; padding: 9px 12px; text-align: left; border-color: var(--muted); color: var(--ink); }
  #menuBtn .mk { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 10px; letter-spacing: 0.08em; }
  #menuBtn b { font: 600 14px/1 var(--display); letter-spacing: 0.04em; overflow: hidden; text-overflow: ellipsis; }
  #menuBtn .mn { margin-left: auto; color: var(--muted); font-weight: 500; }
  #menuBtn .mc { color: var(--amber); font-size: 14px; transition: transform .2s; }
  #menuBtn[aria-expanded="true"] .mc { transform: rotate(180deg); }
  #helpBtn { display: none; }
  #stage { position: relative; height: 58vh; min-height: 340px; }
  #index { top: 0; left: 0; bottom: 0; width: min(340px, 88vw); border-radius: 0; z-index: 30; transform: translateX(-102%); transition: transform .25s; position: fixed; background: var(--panel-solid); padding-top: env(safe-area-inset-top, 0px); }
  #index.open { transform: none; }
  #console { position: static; padding: 10px 16px 0; }
  .throttle { width: 100%; grid-template-columns: 1fr auto; }
  .throttle .tl { display: none; }
  .tt { grid-column: 1 / -1; grid-row: 2; }
  .ticks { grid-column: 1 / -1; }
  .throttle .state { min-width: 0; grid-column: 1 / -1; text-align: left; grid-row: 1; }
  #dossier { position: static; width: auto; margin: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  #pane { overflow: visible; }
  #cmpTray { position: static; max-width: none; padding: 8px 16px 0; }
  .dhead h2 { font-size: 24px; }
  .ssum { grid-template-columns: repeat(3, 1fr); }
  .ssum div:nth-child(3) { border-right: 0; }
  .ssum div:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
  .sgrid { grid-template-columns: 1fr; }
  #sheet .sbox { padding: 14px 14px 18px; }
